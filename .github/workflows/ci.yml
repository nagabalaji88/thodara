name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: thodara_test
          POSTGRES_USER: thodara
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thodara -d thodara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Run API tests against PostgreSQL
        env:
          THODARA_TEST_DATABASE_URL: postgresql+asyncpg://thodara:ci-only-password@localhost:5432/thodara_test
        run: uv run pytest
      - name: Apply PostgreSQL migration
        env:
          THODARA_APP_ENV: test
          THODARA_DATABASE_URL: postgresql+asyncpg://thodara:ci-only-password@localhost:5432/thodara_test
        run: uv run alembic upgrade head
      - name: Verify PostgreSQL migration downgrade and re-upgrade
        env:
          THODARA_APP_ENV: test
          THODARA_DATABASE_URL: postgresql+asyncpg://thodara:ci-only-password@localhost:5432/thodara_test
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
