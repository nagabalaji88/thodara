[project]
name = "thodara-api"
version = "0.1.0"
description = "Thodara manufacturing ERP API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi[standard]>=0.128,<1.0",
  "pydantic-settings>=2.12,<3.0",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.31,<1.0",
  "alembic>=1.18,<2.0",
  "pwdlib[argon2]>=0.3,<1.0",
  "email-validator>=2.2,<3.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[project.scripts]
thodara-api = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1.0",
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.2,<2.0",
  "ruff>=0.14,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
