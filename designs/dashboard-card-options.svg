<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040"><rect width="1440" height="1040" fill="#f4f6f8"/><text x="40" y="35" font-family="Arial,sans-serif" font-size="10" fill="#667482" font-weight="700" text-anchor="start">THODARA  /  DASHBOARD DESIGN EXPLORATION</text><text x="40" y="69" font-family="Arial,sans-serif" font-size="26" fill="#192631" font-weight="700" text-anchor="start">Five metric-card layouts</text><text x="40" y="96" font-family="Arial,sans-serif" font-size="11" fill="#6e7b87" font-weight="400" text-anchor="start">Same operations data, different hierarchy and color treatment. Pick one direction to apply to the dashboard.</text><text x="40" y="134" font-family="Arial,sans-serif" font-size="11" fill="#6178d5" font-weight="700" text-anchor="start">01</text><text x="40" y="159" font-family="Arial,sans-serif" font-size="14" fill="#192631" font-weight="700" text-anchor="start">Compact status strip</text><text x="40" y="181" font-family="Arial,sans-serif" font-size="9" fill="#6e7b87" font-weight="400" text-anchor="start">Lowest height · dots carry category; no individual card chrome.</text><text x="40" y="314" font-family="Arial,sans-serif" font-size="11" fill="#6178d5" font-weight="700" text-anchor="start">02</text><text x="40" y="339" font-family="Arial,sans-serif" font-size="14" fill="#192631" font-weight="700" text-anchor="start">Icon-chip tiles</text><text x="40" y="361" font-family="Arial,sans-serif" font-size="9" fill="#6e7b87" font-weight="400" text-anchor="start">Familiar KPI cards · color stays inside a small tinted icon tile.</text><text x="40" y="494" font-family="Arial,sans-serif" font-size="11" fill="#6178d5" font-weight="700" text-anchor="start">03</text><text x="40" y="519" font-family="Arial,sans-serif" font-size="14" fill="#192631" font-weight="700" text-anchor="start">Number-first cards</text><text x="40" y="541" font-family="Arial,sans-serif" font-size="9" fill="#6e7b87" font-weight="400" text-anchor="start">Fast number scanning · small outlined status pills carry category.</text><text x="40" y="674" font-family="Arial,sans-serif" font-size="11" fill="#6178d5" font-weight="700" text-anchor="start">04</text><text x="40" y="699" font-family="Arial,sans-serif" font-size="14" fill="#192631" font-weight="700" text-anchor="start">Risk-led bento</text><text x="40" y="721" font-family="Arial,sans-serif" font-size="9" fill="#6e7b87" font-weight="400" text-anchor="start">One larger risk tile · supporting metrics stay visually quieter.</text><text x="40" y="854" font-family="Arial,sans-serif" font-size="11" fill="#6178d5" font-weight="700" text-anchor="start">05</text><text x="40" y="879" font-family="Arial,sans-serif" font-size="14" fill="#192631" font-weight="700" text-anchor="start">Two-row compact grid</text><text x="40" y="901" font-family="Arial,sans-serif" font-size="9" fill="#6e7b87" font-weight="400" text-anchor="start">Fits narrower screens · color appears only in small status badges.</text><rect x="280" y="110" width="1120" height="128" rx="12" fill="#fff" stroke="#e5e9ed"/><circle cx="302" cy="159" r="3" fill="#6178d5"/><text x="313" y="158" font-family="Arial,sans-serif" font-size="9" fill="#586673" font-weight="700" text-anchor="start">Open orders</text><text x="302" y="180" font-family="Arial,sans-serif" font-size="8" fill="#87939e" font-weight="400" text-anchor="start">4 due this week</text><text x="535" y="175" font-family="Arial,sans-serif" font-size="23" fill="#192631" font-weight="700" text-anchor="end">24</text><path d="M560 130V218" stroke="#edf0f3"/><circle cx="582" cy="159" r="3" fill="#c7656c"/><text x="593" y="158" font-family="Arial,sans-serif" font-size="9" fill="#586673" font-weight="700" text-anchor="start">At risk</text><text x="582" y="180" font-family="Arial,sans-serif" font-size="8" fill="#87939e" font-weight="400" text-anchor="start">2 need action today</text><text x="815" y="175" font-family="Arial,sans-serif" font-size="23" fill="#c76